# Add this location inside the existing HTTPS server block for wwbt-blog.ru.
# The trailing slash in proxy_pass is important: it removes
# /sandbox/air-hockey/ before forwarding the request to Node.js.
location = /sandbox/air-hockey {
    return 301 /sandbox/air-hockey/;
}

location ^~ /sandbox/air-hockey/ {
    proxy_pass http://127.0.0.1:5174/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
