# Add these directives inside the existing HTTPS VirtualHost for wwbt-blog.ru.
# Required modules: proxy, proxy_http and proxy_wstunnel.

RedirectMatch 301 ^/sandbox/air-hockey$ /sandbox/air-hockey/

ProxyPreserveHost On
ProxyPass        "/sandbox/air-hockey/socket" "ws://127.0.0.1:5174/socket" retry=0 timeout=60
ProxyPassReverse "/sandbox/air-hockey/socket" "ws://127.0.0.1:5174/socket"

ProxyPass        "/sandbox/air-hockey/health" "http://127.0.0.1:5174/health" retry=0
ProxyPassReverse "/sandbox/air-hockey/health" "http://127.0.0.1:5174/health"
