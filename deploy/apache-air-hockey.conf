# Add these directives inside the existing HTTPS VirtualHost for wwbt-blog.ru.
# Required modules: proxy, proxy_http and headers.

RedirectMatch 301 ^/sandbox/air-hockey$ /sandbox/air-hockey/

ProxyPreserveHost On
ProxyPass        "/sandbox/air-hockey/" "http://127.0.0.1:5174/" retry=0 timeout=30
ProxyPassReverse "/sandbox/air-hockey/" "http://127.0.0.1:5174/"

<Location /sandbox/air-hockey/>
    RequestHeader set X-Forwarded-Proto "https"
</Location>
